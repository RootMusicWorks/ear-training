<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>イヤートレーニング</title>
<style>
:root{color-scheme:light dark;--bg:#eef2f4;--fg:#14202a;--card:#fff;--bd:#cfd8de;--muted:#5b6b76;--ac:#0e7490;--acfg:#fff;--ok:#1f8a4c;--ng:#c0392b;--okbg:#ddf2e5;--ngbg:#f7e0dd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1519;--fg:#e6edf1;--card:#182128;--bd:#2c3a43;--muted:#8fa1ac;--ac:#38bdd8;--acfg:#04222b;--ok:#4cc27f;--ng:#ef6b5f;--okbg:#173526;--ngbg:#3a1e1b}}
:root[data-theme="dark"]{--bg:#0f1519;--fg:#e6edf1;--card:#182128;--bd:#2c3a43;--muted:#8fa1ac;--ac:#38bdd8;--acfg:#04222b;--ok:#4cc27f;--ng:#ef6b5f;--okbg:#173526;--ngbg:#3a1e1b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:12px;min-height:48px;padding:6px 12px;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
button.on{background:var(--ac);color:var(--acfg);border-color:var(--ac)}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.seg button{flex:1 1 auto;white-space:nowrap}#levels.seg{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:12px 0}
.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1 1 auto;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;margin-top:12px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.slot{min-height:68px;padding:4px;border:2px dashed var(--bd);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;text-align:center}
.slot small{font-weight:400;color:var(--muted)}
.ok{background:var(--okbg)!important;border-color:var(--ok)!important}
.ng{background:var(--ngbg)!important;border-color:var(--ng)!important}
#play{flex:2 1 auto;font-weight:600}
#fb{margin-top:12px;min-height:24px;white-space:pre-line}
#next{width:100%;margin-top:12px}
.muted{color:var(--muted)}.small{font-size:13px}
[hidden]{display:none!important}
#levels.g{display:block}.lg{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}.lgl{flex:0 0 76px;font-size:12px;color:var(--muted);padding-top:10px}.lgb{display:flex;flex-wrap:wrap;gap:6px;flex:1}.lgb button{flex:0 0 auto;min-width:46px;min-height:40px;padding:4px 8px;white-space:nowrap}
textarea{width:100%;margin-top:8px;font:16px/1.4 ui-monospace,Menlo,monospace;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px}
table.st{width:100%;border-collapse:collapse;font-size:13px}table.st th,table.st td{padding:4px 6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}table.st.mx{font-size:12px;white-space:nowrap}table.st .mo{color:var(--ok);font-weight:600}table.st th{color:var(--muted);font-weight:600}.wk{color:var(--ng);font-weight:600}.h3{margin:14px 0 4px;font-weight:600;font-size:14px}
details.card summary{min-height:44px;display:flex;align-items:center;font-weight:600;cursor:pointer}
</style>
<meta name="theme-color" content="#0e7490">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="イヤトレ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
</head>
<body>
<main>
<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h1>イヤートレーニング</h1><span style="display:flex;gap:6px"><button id="rev" style="min-height:36px;font-size:13px;padding:4px 10px">復習 OFF</button><button id="nolog" style="min-height:36px;font-size:13px;padding:4px 10px">記録: ON</button></span></div>
<section class="card" id="lsn"></section>
<section class="card" id="tsc" hidden></section>
<div id="mlv"><div class="seg" id="modes"></div>
<div class="seg" id="levels"></div></div>
<p class="muted small" id="desc" style="margin:0"></p>
<p class="muted small" id="stat" style="margin:0 0 4px"></p>
<div id="tbar" style="margin:0 0 6px"></div>
<section class="card" id="song" hidden></section>
<section class="card" id="qcard">
<p id="prompt" style="margin:0 0 12px"></p>
<div class="row"><button id="play" class="on">▶ 聴く</button><button id="slow">スロー OFF</button><button id="loop">ループ OFF</button><button id="ref" hidden>主音</button><button id="study" hidden>お手本 OFF</button><button id="diff" hidden>変化する音</button><button id="pa" hidden>1つ目だけ</button><button id="pb" hidden>2つ目だけ</button><button id="rfix" hidden>ルート: 固定</button></div>
<div class="slots" id="slots" hidden></div>
<div class="grid" id="opts"></div>
<div id="fb"></div>
<button id="next" hidden>次の問題</button>
</section>
<details class="card" id="cndp" hidden><summary>出題条件：<span id="cnds" style="margin-left:6px;font-weight:400"></span></summary><div id="cndb" style="margin-top:8px"></div><p class="muted small" id="cndn"></p></details>
<p class="muted small">音が出ない場合は、端末のマナーモードを解除して音量を確認してください。記録はこのブラウザ内に保存されます。</p>
<details class="card" id="stats"><summary>学習記録</summary><div id="sbody" class="small"></div></details>
<details class="card" id="data"><summary>データ管理（バックアップ）</summary>
<p class="muted small" id="dsum"></p>
<div class="row"><button id="exp">書き出し</button><button id="imp">検証</button></div>
<div class="row" style="margin-top:8px"><button id="cpy">コピー</button><button id="pst">貼り付け</button></div>
<div class="row" style="margin-top:8px"><button id="rst">記録をリセット</button><button id="rsu">直前の状態に戻す</button></div>
<textarea id="box" rows="5" placeholder="書き出したデータがここに出ます。読み込むときは、バックアップをここに貼り付けて「検証」を押します。"></textarea>
<p class="small" id="dmsg"></p>
<button id="apply" hidden style="width:100%">この内容で上書き</button>
</details>
</main>

if(nw&&learn.length<2)nb={n:'新規：'+MNM[nw.m]+'を始める',m:nw.m};

else{const o=learn.find(x=>x.m!=fc.m)||fc;nb={n:focusN(o),m:o.m}}
const pool=[];A.filter(x=>x.started).forEach(x=>{pool.push(x.m);if(x.learning)pool.push(x.m)});if(!pool.length)pool.push('c');
const R_=t=>rv?{n:'復習・苦手：'+MNM[rv.m]+'（'+why(rv)+'）',mins:t,m:rv.m,rev:1}:{n:'復習（期限切れ・苦手なし）→'+focusN(fc),mins:t,m:fc.m,rev:1},
